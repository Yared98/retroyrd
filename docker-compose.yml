version: "3.8"

services:
  retro:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_RETRO_URL=${VITE_RETRO_URL:-}
        - VITE_DAILY_URL=${VITE_DAILY_URL:-}
        - VITE_PLANNING_URL=${VITE_PLANNING_URL:-}
        - VITE_COFFEE_URL=${VITE_COFFEE_URL:-}
    container_name: internal-retro
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=/app/data/retro.db
      - STATIC_DIR=/app/dist
      - BOARD_RETENTION_DAYS=60
      - RUST_LOG=backend=info,tower_http=info
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - retro_data:/app/data

volumes:
  retro_data:
    driver: local
